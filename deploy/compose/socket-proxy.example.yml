services:
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: moegate-docker-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      IMAGES: 1
      NETWORKS: 1
      VOLUMES: 0
      INFO: 1
      VERSION: 1
      POST: 1
      BUILD: 1
      COMMIT: 0
      CONFIGS: 0
      DISTRIBUTION: 0
      EXEC: 0
      GRPC: 0
      PLUGINS: 0
      SECRETS: 0
      SERVICES: 0
      SESSION: 0
      SWARM: 0
      SYSTEM: 0
      TASKS: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  moegate:
    # Compose v5：volumes !reset 会丢挂载，必须用 !override 完整覆盖
    volumes: !override
      - moegate-data:${ALLOWED_BASE_DIR:-/data/containers}
      # 与根 compose 一致：取证卷必须保留，且 name=moegate-captures
      - moegate-captures:${TRAFFIC_CAPTURE_DIR:-/data/captures}
    environment:
      DOCKER_HOST: tcp://docker-socket-proxy:2375
    depends_on:
      - docker-socket-proxy
